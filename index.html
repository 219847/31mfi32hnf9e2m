
<!DOCTYPE html>
<html>
<head>
  <title>Inbox Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Inbox Monitor</h1>

<div id="login">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signIn()">Sign In</button>
  <button onclick="signUp()">Create Account</button>
</div>

<button id="logout" onclick="signOut()" hidden>Sign Out</button>

<p id="status">Please sign in.</p>

<script>
const SUPABASE_URL =
  "https://hsxfolyazybmvemaxghs.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzeGZvbHlhenlibXZlbWF4Z2hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMzYwMTYsImV4cCI6MjEwOTkxMjAxNn0.HBarKA6eUqHWPVSHvRKPuUtv3pbjT4TmdGCIKCArFlQ";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let recentEmail = false;
let flash = false;

async function signIn() {
  const { error } = await client.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    document.getElementById("status").textContent = error.message;
    return;
  }

  updateUI();
}

async function signUp() {
  const { error } = await client.auth.signUp({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  document.getElementById("status").textContent =
    error ? error.message : "Check your email to confirm registration.";
}

async function signOut() {
  await client.auth.signOut();
  recentEmail = false;
  document.title = "Inbox Monitor";
  updateUI();
}

async function updateUI() {
  const { data: { session } } = await client.auth.getSession();

  document.getElementById("login").hidden = !!session;
  document.getElementById("logout").hidden = !session;

  if (!session) {
    document.getElementById("status").textContent = "Please sign in.";
    recentEmail = false;
    return;
  }

  document.getElementById("status").textContent = "Signed in.";
  checkEmail();
}

async function checkEmail() {
  const { data: { session } } = await client.auth.getSession();

  if (!session) return;

  const { data, error } = await client.functions.invoke(
    "rapid-processor"
  );

  if (error) {
    console.error(error);
    document.getElementById("status").textContent =
      "Error checking emails.";
    return;
  }

  recentEmail = data.recent;

  document.getElementById("status").textContent =
    recentEmail ? "New email detected!" : "No recent emails.";
}

client.auth.onAuthStateChange(() => {
  updateUI();
});

setInterval(checkEmail, 5000);

setInterval(() => {
  if (recentEmail) {
    flash = !flash;
    document.title = flash
      ? "NEW EMAIL RECEIVED!"
      : "Inbox Monitor";
  } else {
    document.title = "Inbox Monitor";
  }
}, 500);

updateUI();
</script>

</body>
</html>
